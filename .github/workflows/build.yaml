name: Build

# Does it build and pass its checks on Windows, Linux and macOS: the core's tests, the interface's
# checks (retargeting, variants, editor keys), then the studio and its MCP server, without
# installers.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  app:
    name: Studio (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-${{ matrix.os }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Test the core
        run: cargo test -p animation-studio-core

      - name: Check the interface's logic
        run: |
          yarn install --frozen-lockfile
          yarn check:retarget
          yarn check:variants
          yarn check:keys

      - name: Build the studio (no installer) and the MCP server
        run: |
          yarn tauri build --no-bundle
          cargo build --release -p opengoal-animation-studio-mcp
