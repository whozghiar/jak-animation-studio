name: Format

# Run by hand on a branch (Actions > Format > Run workflow): formats the code as the pre-commit hook
# does (rustfmt, Prettier) and commits the result to the branch when something changed. For changes
# made without the hook, such as edits on GitHub's website.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    name: Format and commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        run: |
          yarn install --frozen-lockfile
          yarn format

      - name: Commit what changed
        run: |
          if git diff --quiet; then
            echo "The code was already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: format the code"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
